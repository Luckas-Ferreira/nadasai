<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Nada Sai — Ferramentas Gratuitas de Imagem, PDF e Áudio 100% Offline</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="Edite imagens, PDFs e áudios (cortar, juntar, converter e comprimir MP3/WAV) 100% offline no navegador. Processamento privado e gratuito, sem enviar nada para servidores.">
  <meta name="keywords" content="editar imagem, editar pdf, cortar audio, juntar audio, converter audio, comprimir audio, remover fundo, juntar pdf, comprimir pdf, converter imagem, offline, privacidade, ferramentas de audio">
  <meta name="author" content="Nada Sai">
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
  <meta name="theme-color" content="#ffffff">

  <!-- Canonical & hreflang are deliberately NOT here.
       This file is served verbatim for every URL (SPA fallback), so a canonical
       hardcoded to /pt told every crawler that all 72 tool pages were duplicates
       of the home page — and Bing and the LLM crawlers never run the JS that
       would have corrected it. SeoService sets both per route after hydration,
       and the prerendered HTML carries the right ones per file. No canonical is
       far better than a wrong one. -->

  <!-- Open Graph / Facebook / LinkedIn -->
  <meta property="og:site_name" content="Nada Sai">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Nada Sai — Ferramentas Gratuitas de Imagem, PDF e Áudio 100% Offline">
  <meta property="og:description" content="Remova fundo de fotos, edite PDFs, corte, converta, junte e comprima áudios MP3/WAV direto no seu navegador com privacidade total. Seus arquivos nunca saem do seu computador.">
  <meta property="og:url" content="https://nadasai.com/pt">
  <!-- PNG, e não o logo SVG que estava aqui: crawler social nenhum rasteriza
       SVG, então todo link compartilhado aparecia sem imagem. Gerado por
       scripts/generate-og-cards.mjs. O SeoService troca por um card específico
       da ferramenta depois da hidratação; as 74 páginas prerenderizadas já
       nascem com o certo. Este é o do fallback de SPA. -->
  <meta property="og:image" content="https://nadasai.com/og/default-pt.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Nada Sai — seus arquivos não saem do seu computador">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:locale:alternate" content="en_US">

  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Nada Sai — Ferramentas Gratuitas de Imagem, PDF e Áudio 100% Offline">
  <meta name="twitter:description" content="Edite imagens, PDFs e áudios no seu navegador sem enviar nada para servidores. Privacidade total e ferramentas 100% locais.">
  <meta name="twitter:image" content="https://nadasai.com/og/default-pt.png">
  <meta name="twitter:image:alt" content="Nada Sai — seus arquivos não saem do seu computador">

  <!-- Favicon & Manifest -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Preload da fonte. `scripts/preload-fonts.mjs` reescreve estes href com o
       nome com hash no build e replica as tags nas 74 páginas geradas; o que
       está aqui serve o `ng serve` e documenta a intenção.

       Sem preload, a fonte só é descoberta depois que o CSS é baixado e
       parseado — um round trip inteiro depois do que precisava. Junto com o
       fallback de métricas casadas em styles.css, é o par que derruba o CLS de
       0,2126 medido em /pt/privacidade.

       `crossorigin` é obrigatório mesmo sendo same-origin: preload de fonte é
       sempre feito em modo CORS, e sem o atributo o navegador baixa DUAS vezes
       (uma para o preload, outra para o uso) e avisa no console. -->
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="media/nunito-latin-400-normal.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="media/nunito-latin-500-normal.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="media/nunito-latin-600-normal.woff2">

  <!-- JSON-LD MÍNIMO, de propósito.

       Aqui havia um grafo com `featureList` de 22 ferramentas — sem o módulo de
       privacidade inteiro e sem video-to-audio, de 32 que existem. Ele era
       sobrescrito pelo SeoService logo depois do bootstrap, e as 74 páginas
       prerenderizadas já saem com o grafo certo (derivado de TOOLS, portanto
       incapaz de ficar velho). Mas este arquivo é servido literalmente no
       fallback de SPA, e crawler que não executa JS — Bing, os de LLM — lia a
       lista defasada e mais nada.

       O que sobra é só o que é verdade em qualquer URL e não pode envelhecer:
       identidade do site. Tudo que é por página vem do prerender ou do
       SeoService. Uma lista a menos para alguém esquecer de atualizar. -->
  <script type="application/ld+json" id="seo-jsonld">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://nadasai.com/#organization",
          "name": "Nada Sai",
          "url": "https://nadasai.com",
          "logo": {
            "@type": "ImageObject",
            "url": "https://nadasai.com/og/logo-512.png",
            "width": 512,
            "height": 512
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://nadasai.com/#website",
          "url": "https://nadasai.com",
          "name": "Nada Sai",
          "publisher": { "@id": "https://nadasai.com/#organization" },
          "inLanguage": "pt-BR"
        }
      ]
    }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
