<app-tool-page [toolId]="'password-generator'" [forceLoaded]="true">

  <!-- STAGE: the password, its entropy and the strength band -->
  <div stage class="space-y-5">
    <app-panel>
      <div class="space-y-4">
        <div class="flex min-h-[80px] items-center justify-between gap-4 rounded-lg border border-line bg-raised p-4">
          <span class="min-w-0 break-all font-mono text-xl font-semibold tracking-wider select-all text-text">
            {{ password() || '…' }}
          </span>
          <button type="button" appButton variant="primary" size="md" (click)="copy()" class="shrink-0">
            <app-icon [name]="copied() ? 'check' : 'copy'" [size]="16" />
            <span>{{ copied() ? i18n.t()['passgen.copied'] : i18n.t()['passgen.copy'] }}</span>
          </button>
        </div>

        <div class="space-y-1.5">
          <div class="flex justify-between text-xs text-muted">
            <span>
              {{ i18n.t()['passgen.entropy'] }}:
              <span class="font-mono tabular font-semibold text-text">{{ entropy() }} bits</span>
            </span>
            <span [class]="strengthTextClass()" class="font-semibold">{{ strengthLabel() }}</span>
          </div>
          <div class="h-2 w-full overflow-hidden rounded-full border border-line bg-raised">
            <div
              class="h-full transition-all duration-300"
              [class]="strengthBarClass()"
              [style.width.%]="strengthPercent()"
            ></div>
          </div>
        </div>

        @if (!anyClassSelected()) {
          <p class="text-xs text-danger">{{ i18n.t()['passgen.no_classes'] }}</p>
        }
      </div>
    </app-panel>
  </div>

  <!-- PANEL: controls -->
  <div panel class="flex flex-col gap-4">
    <app-panel [heading]="i18n.t()['passgen.title']">
      <div class="space-y-5">
        <div class="space-y-2">
          <div class="flex justify-between text-xs font-semibold text-text">
            <span>{{ i18n.t()['passgen.length'] }}</span>
            <span class="font-mono tabular text-sm font-semibold text-accent">{{ length() }}</span>
          </div>
          <input
            type="range"
            min="8"
            max="128"
            [ngModel]="length()"
            (ngModelChange)="setLength($event)"
            class="w-full cursor-pointer accent-accent"
          />
        </div>

        <div class="grid grid-cols-1 gap-2 text-xs font-medium">
          @for (opt of charOptions; track opt.key) {
            <label
              class="flex cursor-pointer items-center gap-2.5 rounded-md border border-line bg-raised p-3 transition hover:border-line-strong"
            >
              <input
                type="checkbox"
                [ngModel]="opt.value()"
                (ngModelChange)="opt.set($event)"
                class="h-4 w-4 rounded accent-accent"
              />
              <span class="text-text">{{ i18n.t()[opt.key] }}</span>
            </label>
          }
        </div>

        <button type="button" appButton variant="secondary" size="lg" block (click)="generate()">
          <app-icon name="refresh" [size]="18" />
          <span>{{ i18n.t()['passgen.generate'] }}</span>
        </button>
      </div>
    </app-panel>
  </div>

</app-tool-page>
