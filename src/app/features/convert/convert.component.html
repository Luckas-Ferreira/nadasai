<app-tool-page [toolId]="'convert'">
  @if (errorKey(); as key) {
    <div banner class="mb-5">
      <app-alert [message]="i18n.t()[key]" [actionLabel]="i18n.t()['common.retry']" (action)="run()" />
    </div>
  }

  <div stage>
    @if (!sourceUrl()) {
      <app-dropzone (fileSelected)="onFile($event)" />
    } @else {
      <app-preview-surface
        [src]="previewUrl()"
        [busy]="busy()"
        checkerboard
        [alt]="i18n.t()['common.original']"
      />
    }
  </div>

  <div panel class="flex flex-col gap-4">
    @if (sourceUrl()) {
      <app-panel [heading]="i18n.t()['convert.select_format']">
        <app-segmented
          [options]="formatOptions"
          [value]="format()"
          (valueChange)="onFormatChange($event)"
          [columns]="3"
          [ariaLabel]="i18n.t()['convert.select_format']"
        />

        @if (format() === 'PDF') {
          <div class="mt-4 border-t border-line pt-3">
            <span class="mb-2 block text-2xs font-medium uppercase text-faint">
              {{ i18n.t()['convert.pdf_bg'] }}
            </span>

            <app-segmented
              [options]="backdropOptions"
              [value]="pdfBackground()"
              (valueChange)="pdfBackground.set($event)"
              [ariaLabel]="i18n.t()['convert.pdf_bg']"
            />
          </div>
        }

        @if (isTerminal()) {
          <p class="mt-4 border-t border-line pt-3 text-xs text-faint">
            {{ i18n.t()['convert.terminal_note'] }}
          </p>
        }

        @if (resultSize(); as size) {
          <div class="mt-4 flex justify-between border-t border-line pt-3 text-sm">
            <span class="text-muted">{{ i18n.t()['common.result'] }}</span>
            <span class="font-mono text-text tabular">{{ size }}</span>
          </div>
        }
      </app-panel>

      <app-action-bar
        [primaryLabel]="stale() ? i18n.t()['convert.btn'] : null"
        [busy]="busy()"
        [canDownload]="!!resultBlob()"
        [canContinue]="!!resultBlob() && !isTerminal()"
        (primary)="run()"
        (download)="download()"
        (continueEdit)="continueEdit()"
        (reset)="reset()"
      />
    }
  </div>
</app-tool-page>
