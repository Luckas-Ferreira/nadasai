<app-tool-page [toolId]="'crop'">
  @if (errorKey(); as key) {
    <div banner class="mb-5">
      <app-alert [message]="i18n.t()[key]" [actionLabel]="i18n.t()['common.retry']" (action)="run()" />
    </div>
  }

  <div stage>
    @if (!sourceUrl()) {
      <app-dropzone (fileSelected)="onFile($event)" />
    } @else {
      <div class="flex min-h-[420px] items-center justify-center overflow-hidden rounded-xl border border-stage-line bg-stage p-4">
        <!-- Stays mounted after cropping so the selection can be adjusted and re-applied. -->
        <img #image [src]="sourceUrl()" [alt]="i18n.t()['common.original']" class="block max-w-full" />
      </div>
    }
  </div>

  <div panel class="flex flex-col gap-4">
    @if (sourceUrl()) {
      <app-panel [heading]="i18n.t()['crop.aspect']">
        <div class="grid grid-cols-3 gap-1.5">
          @for (option of ratioOptions; track option.label) {
            <button
              appButton
              [variant]="ratio() === option.value ? 'secondary' : 'ghost'"
              size="sm"
              [attr.aria-pressed]="ratio() === option.value"
              (click)="setRatio(option.value)"
            >
              {{ option.label || i18n.t()['crop.ratio.free'] }}
            </button>
          }
        </div>

        <div class="mt-4 grid grid-cols-3 gap-1.5 border-t border-line pt-3">
          <button appButton variant="ghost" size="sm" (click)="rotate()">
            <app-icon name="rotate" [size]="14" />
            {{ i18n.t()['crop.rotate'] }}
          </button>

          <button appButton variant="ghost" size="sm" (click)="flip()">
            <app-icon name="flip" [size]="14" />
            {{ i18n.t()['crop.flip'] }}
          </button>

          <button appButton variant="ghost" size="sm" (click)="resetBox()">
            <app-icon name="refresh" [size]="14" />
            {{ i18n.t()['crop.reset_box'] }}
          </button>
        </div>
      </app-panel>

      @if (resultUrl(); as result) {
        <app-panel [heading]="i18n.t()['common.result']">
          <div class="checkerboard flex items-center justify-center rounded-md border border-line bg-stage p-2">
            <img [src]="result" [alt]="i18n.t()['common.result']" class="max-h-44 max-w-full object-contain" />
          </div>

          @if (resultSize(); as size) {
            <p class="mt-2.5 text-center font-mono text-xs text-faint tabular">{{ size }}</p>
          }
        </app-panel>
      }

      <app-action-bar
        [toolId]="'crop'"
        [primaryLabel]="stale() ? i18n.t()['crop.btn'] : null"
        [busy]="busy()"
        [canDownload]="!!resultUrl()"
        (primary)="run()"
        (download)="download()"
        (reset)="reset()"
      />
    }
  </div>
</app-tool-page>
