<app-tool-page [toolId]="'remove-bg'">
  @if (errorKey(); as key) {
    <div banner class="mb-5">
      <app-alert [message]="i18n.t()[key]" [actionLabel]="i18n.t()['common.retry']" (action)="run()" />
    </div>
  }

  <div stage>
    @if (!sourceUrl()) {
      <app-dropzone (fileSelected)="onFile($event)" />
    } @else if (cutoutUrl() && isTransparent()) {
      <app-compare-slider [before]="sourceUrl()!" [after]="cutoutUrl()!" checkerboard />
    } @else if (cutoutUrl()) {
      <app-preview-surface
        [src]="cutoutUrl()"
        [background]="backdrop()"
        [alt]="i18n.t()['common.result']"
      />
    } @else {
      <app-preview-surface
        [src]="sourceUrl()"
        [busy]="busy()"
        [progress]="busy() ? progress() : null"
        [busyLabel]="i18n.t()['bg.running']"
        [alt]="i18n.t()['common.original']"
      />
    }
  </div>

  <div panel class="flex flex-col gap-4">
    @if (sourceUrl()) {
      @if (cutoutUrl()) {
        <app-panel [heading]="i18n.t()['bg.bg_color']">
          <div class="flex flex-wrap gap-2">
            @for (color of backdrops; track color) {
              <button
                type="button"
                (click)="backdrop.set(color)"
                [attr.aria-label]="color === transparent ? i18n.t()['bg.transparent'] : color"
                [attr.aria-pressed]="backdrop() === color"
                class="h-8 w-8 rounded-md border-2 transition-transform hover:scale-110"
                [class.checkerboard]="color === transparent"
                [class.bg-stage]="color === transparent"
                [class.border-accent]="backdrop() === color"
                [class.border-line]="backdrop() !== color"
                [style.background-color]="color === transparent ? null : color"
              ></button>
            }
          </div>
        </app-panel>
      }

      <app-action-bar
        [primaryLabel]="i18n.t()['bg.btn']"
        [busy]="busy()"
        [canDownload]="!!cutoutUrl()"
        [canContinue]="!!cutoutUrl()"
        (primary)="run()"
        (download)="download()"
        (continueEdit)="continueEdit()"
        (reset)="reset()"
      />
    }
  </div>
</app-tool-page>
