<app-splash-screen />

<!-- Pular para o conteúdo (WCAG 2.4.1, nível A).
     Numa página de ferramenta, quem navega por teclado ou leitor de tela
     atravessava a barra do topo (logo, switcher, busca, medidor) MAIS até dez
     links do rail antes de chegar no dropzone — em toda navegação. O rail ser
     escopado por módulo limita o tamanho do problema, não o resolve.

     Visível só no foco: `sr-only` até receber foco, e aí vira um botão real no
     canto. `z-50` porque a barra do topo é sticky com `z-40` e o link precisa
     ficar por cima dela para ser visto quando aparece. -->
<a
  href="#main"
  class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50 focus:rounded-md
         focus:border focus:border-line focus:bg-surface focus:px-4 focus:py-2.5
         focus:text-sm focus:font-semibold focus:text-accent focus:shadow-panel"
  >{{ i18n.t()['nav.skip_to_content'] }}</a
>

<div class="flex min-h-dvh flex-col bg-base">
  <!-- One identity surface for every viewport. The rail no longer carries the
       logo, so it gets its whole height for tools. -->
  <app-top-bar />

  <div class="flex min-w-0 flex-1">
    <!-- The rail. Scoped to the current module, so it renders nothing on the home
         page and on the institutional routes. `top-14` because the top bar above
         it is sticky and 56px tall; the scroll is the floor for a module that one
         day carries twenty tools. -->
    @if (activeTool.module()) {
      <aside
        class="sticky top-14 hidden h-[calc(100dvh-3.5rem)] w-[228px] shrink-0 overflow-y-auto border-r border-rail-line bg-rail px-3 py-3 md:block"
      >
        <app-tool-nav />
      </aside>
    }

    <div class="flex min-w-0 flex-1 flex-col">
      <app-file-bar />

      <!-- Extra bottom padding on mobile so the last controls clear the tool bar. -->
      <!-- `tabindex="-1"` para o salto do skip link mover mesmo o foco: sem ele
           o navegador rola até a âncora e deixa o foco onde estava, então o
           próximo Tab volta para a navegação que a pessoa acabou de pular. -->
      <main id="main" tabindex="-1" class="flex-1 px-5 py-6 pb-24 md:px-8 md:py-8 md:pb-8">
        <!-- O que escapou de todo try/catch de ferramenta. Fica AQUI, e não
             dentro da ferramenta, porque a exceção pode vir de onde não há
             ferramenta nenhuma — um effect da casca, uma promise rejeitada, uma
             biblioteca de terceiro. Ver core/errors/global-error-handler.ts. -->
        @if (globalError.message(); as message) {
          <div class="mb-5">
            <app-alert [message]="message" dismissible (dismiss)="globalError.dismiss()" />
          </div>
        }

        <router-outlet />
      </main>

      <footer class="border-t border-line px-5 py-4 md:px-8">
        <div
          class="flex flex-col gap-3 text-xs text-faint sm:flex-row sm:items-center sm:justify-between"
        >
          <p>{{ i18n.t()['app.footer.secure'] }}</p>

          <!-- Nomeado porque a página tem três <nav> (rail, barra mobile, este)
               e os outros dois já se identificam. Sem rótulo, o leitor de tela
               anuncia "navegação" três vezes e nenhuma delas diz qual é. -->
          <nav class="flex gap-4" [attr.aria-label]="i18n.t()['nav.footer']">
            <a
              [routerLink]="'/' + i18n.currentLang() + (i18n.currentLang() === 'en' ? '/about' : '/sobre')"
              class="hover:text-muted"
              >{{ i18n.t()['app.footer.about'] }}</a
            >
            <a
              [routerLink]="'/' + i18n.currentLang() + (i18n.currentLang() === 'en' ? '/privacy' : '/privacidade')"
              class="hover:text-muted"
              >{{ i18n.t()['app.footer.privacy'] }}</a
            >
            <a
              [routerLink]="'/' + i18n.currentLang() + (i18n.currentLang() === 'en' ? '/terms' : '/termos')"
              class="hover:text-muted"
              >{{ i18n.t()['app.footer.terms'] }}</a
            >
            <a [routerLink]="'/' + i18n.currentLang() + '/faq'" class="hover:text-muted">{{
              i18n.t()['app.footer.faq']
            }}</a>
          </nav>
        </div>
      </footer>
    </div>
  </div>

  <app-mobile-tool-bar />
  <app-file-viewer />
  <app-command-palette />
  <app-model-download-bar />
  <app-update-overlay />
</div>
