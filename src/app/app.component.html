<div class="flex min-h-dvh bg-base">
  <!-- Rail. Stays dark in both themes: it anchors the layout and frames the stage. -->
  <!-- Rail. Flips with the theme, so everything inside it reads rail-* tokens. -->
  <aside class="sticky top-0 hidden h-dvh w-[228px] shrink-0 flex-col border-r border-rail-line bg-rail md:flex">
    <a routerLink="/" class="flex h-14 items-center gap-2.5 px-4">
      <img src="logo.webp" alt="" class="h-6 w-6 object-contain" />
      <span class="text-md font-semibold text-rail-text">ImgWork</span>
    </a>

    <div class="px-3 py-2">
      <p class="px-2.5 pb-2 text-2xs font-medium uppercase text-rail-faint">
        {{ i18n.t()['nav.tools'] }}
      </p>
      <app-tool-nav />
    </div>

    <div class="mt-auto flex items-center justify-between gap-2 border-t border-rail-line p-3">
      <app-segmented
        [options]="languages"
        [value]="i18n.currentLang()"
        (valueChange)="i18n.setLanguage($event)"
        [ariaLabel]="i18n.t()['app.lang_switch']"
        onRail
      />

      <button
        type="button"
        (click)="themes.toggle()"
        [attr.aria-label]="i18n.t()['app.theme_switch']"
        class="flex h-8 w-8 items-center justify-center rounded-full text-rail-muted
               transition-colors hover:bg-rail-hover hover:text-rail-text"
      >
        <app-icon [name]="themes.theme() === 'dark' ? 'sun' : 'moon'" [size]="16" />
      </button>
    </div>
  </aside>

  <div class="flex min-w-0 flex-1 flex-col">
    <!-- Mobile bar: the rail collapses, so the tools move into a scrollable strip. -->
    <header class="sticky top-0 z-30 border-b border-line bg-surface md:hidden">
      <div class="flex h-14 items-center gap-3 px-4">
        <a routerLink="/" class="flex items-center gap-2">
          <img src="logo.webp" alt="" class="h-5 w-5 object-contain" />
          <span class="text-md font-semibold">ImgWork</span>
        </a>

        <button
          type="button"
          (click)="themes.toggle()"
          [attr.aria-label]="i18n.t()['app.theme_switch']"
          class="ml-auto flex h-8 w-8 items-center justify-center rounded-md text-muted hover:bg-raised"
        >
          <app-icon [name]="themes.theme() === 'dark' ? 'sun' : 'moon'" [size]="16" />
        </button>

        <app-segmented
          [options]="languages"
          [value]="i18n.currentLang()"
          (valueChange)="i18n.setLanguage($event)"
          [ariaLabel]="i18n.t()['app.lang_switch']"
        />
      </div>

      <div class="overflow-x-auto bg-rail px-3 py-2">
        <app-tool-nav horizontal />
      </div>
    </header>

    <app-current-file-bar />

    <main class="flex-1 px-5 py-6 md:px-8 md:py-8">
      <router-outlet />
    </main>

    <footer class="border-t border-line px-5 py-4 md:px-8">
      <div class="flex flex-col gap-1.5 text-xs text-faint sm:flex-row sm:items-center sm:justify-between">
        <p>{{ i18n.t()['app.footer.secure'] }}</p>

        <nav class="flex gap-4">
          <a href="#" class="hover:text-muted">{{ i18n.t()['app.footer.about'] }}</a>
          <a href="#" class="hover:text-muted">{{ i18n.t()['app.footer.privacy'] }}</a>
          <a href="#" class="hover:text-muted">{{ i18n.t()['app.footer.terms'] }}</a>
        </nav>
      </div>
    </footer>
  </div>
</div>
