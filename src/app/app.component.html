<div class="h-screen flex flex-col bg-slate-50 text-slate-800 font-sans selection:bg-teal-200 selection:text-teal-900 overflow-hidden">
  
  <!-- Top Header -->
  <header class="bg-white/80 backdrop-blur-md shadow-sm h-20 flex items-center justify-between px-6 sm:px-12 shrink-0 z-30">
    
    <!-- Logo -->
    <a routerLink="/" class="flex items-center gap-3 hover:opacity-80 transition-opacity">
      <img src="logo.webp" alt="Logo" class="w-10 h-10 object-contain drop-shadow-md">
      <h2 class="text-2xl font-black text-slate-800 tracking-tight bg-gradient-to-r from-teal-600 to-emerald-500 bg-clip-text text-transparent hidden sm:block">
        ImgWork<span class="text-teal-400">.</span>
      </h2>
    </a>
    
    <!-- Actions -->
    <div class="flex items-center gap-4">
      <button (click)="i18n.toggleLanguage()" class="flex items-center gap-2 text-sm font-semibold text-slate-600 hover:text-slate-900 transition-colors bg-slate-100 hover:bg-slate-200 px-5 py-2.5 rounded-full shadow-sm">
        <svg class="w-5 h-5 text-teal-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span>{{ i18n.t()['app.lang.btn'] }}</span>
      </button>
    </div>
  </header>

  <!-- Scrollable Workspace -->
  <main class="flex-grow overflow-y-auto overflow-x-hidden p-4 sm:p-8">
    <div class="max-w-6xl mx-auto flex flex-col pb-8 h-full">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
